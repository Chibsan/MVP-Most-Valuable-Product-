version: '3.8'

services:
  db:
    image: postgres:15
    environment:
      POSTGRES_USER: mvp4u_user
      POSTGRES_PASSWORD: mvp4u_password
      POSTGRES_DB: mvp4u_db
    ports:
      - "5432:5432"

  backend:
    build: ./backend
    ports:
      - "8000:8000"
    depends_on:
      - db
    environment:
      - DATABASE_URL=postgresql://mvp4u_user:mvp4u_password@db:5432/mvp4u_db
